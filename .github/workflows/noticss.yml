name: Noticss · edition

# Twice a day, off the top of the hour (GitHub's scheduler is busiest there):
#   11:41 UTC = 05:41 in Costa Rica, the morning edition;
#   21:41 UTC = 15:41 in Costa Rica, the afternoon edition.
# Costa Rica is UTC-6 all year. GitHub only runs schedules from the default
# branch's copy of this file, so nothing runs on a timer until it is on main.
on:
  schedule:
    - cron: "41 11 * * *"
    - cron: "41 21 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "manana or tarde (empty: by the hour in Costa Rica)"
        required: false
      date:
        description: "YYYY-MM-DD (empty: today in Costa Rica)"
        required: false

concurrency:
  group: noticss-edition
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Without a key the run does not fail: the editions already published
      # stay, and nothing is committed. Add ANTHROPIC_API_KEY under Settings >
      # Secrets and variables > Actions. NOTICSS_MODEL (a repository variable)
      # can change the model; the default is in scripts/noticss/generate.mjs.
      - name: Make the edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTICSS_MODEL: ${{ vars.NOTICSS_MODEL }}
          SLOT: ${{ inputs.slot }}
          DATE: ${{ inputs.date }}
        run: |
          set -- 
          case "$SLOT" in manana|tarde) set -- "$@" --slot "$SLOT" ;; "") ;; *) echo "bad slot"; exit 1 ;; esac
          if [ -n "$DATE" ]; then
            echo "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "bad date"; exit 1; }
            set -- "$@" --date "$DATE"
          fi
          node scripts/noticss/edition.mjs "$@"

      - name: Anything new?
        id: diff
        run: |
          git add data/noticss
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # The app must still build with the new edition before it reaches main
      # (a push to main is a deploy).
      - name: Build the portal against it
        if: steps.diff.outputs.changed == 'true'
        run: npx next build

      - name: Publish
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          name=$(git diff --cached --name-only -- 'data/noticss/*.json' | head -1 | xargs -r basename -s .json)
          git commit -q -m "Noticss: edition ${name:-update}"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
