<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1450" width="1000" height="1450"><title>Tres fuentes de recombinación genética</title><defs><filter id="g0" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#35e6ff" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g1" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff53c8" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g2" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#66ffa6" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g3" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ffd84d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g4" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff8a3d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="1450" fill="#070d24"/><text x="500.0" y="92.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="46" fill="#e8f0ff" text-anchor="middle" font-weight="600">Recombinación</text><text x="500.0" y="140.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#8fa3cc" text-anchor="middle" font-weight="500">la reproducción sexual baraja alelos</text><line x1="300.0" y1="230.0" x2="700.0" y2="230.0" stroke="#35e6ff" stroke-width="14" stroke-linecap="round"/><line x1="300.0" y1="270.0" x2="700.0" y2="270.0" stroke="#ff53c8" stroke-width="14" stroke-linecap="round"/><line x1="500.0" y1="300.0" x2="500.0" y2="334.0" stroke="#e8f0ff" stroke-width="4" stroke-linecap="round"/><polygon points="500.0,350.0 508.0,334.0 492.0,334.0" fill="#e8f0ff"/><line x1="300.0" y1="390.0" x2="520.0" y2="390.0" stroke="#35e6ff" stroke-width="14" stroke-linecap="round"/><line x1="520.0" y1="390.0" x2="700.0" y2="390.0" stroke="#ff53c8" stroke-width="14" stroke-linecap="round"/><line x1="300.0" y1="430.0" x2="520.0" y2="430.0" stroke="#ff53c8" stroke-width="14" stroke-linecap="round"/><line x1="520.0" y1="430.0" x2="700.0" y2="430.0" stroke="#35e6ff" stroke-width="14" stroke-linecap="round"/><text x="500.0" y="486.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="middle" font-weight="500">los homólogos intercambian trozos</text><rect x="60.0" y="520.0" width="880.0" height="118.0" rx="20" fill="#0d1734" stroke="#35e6ff" stroke-width="3" filter="url(#g0)"/><text x="94.0" y="591.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="34" fill="#35e6ff" text-anchor="start" font-weight="700">01</text><text x="168.0" y="568.7" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="29" fill="#35e6ff" text-anchor="start" font-weight="700">Entrecruzamiento</text><text x="168.0" y="602.8" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="start" font-weight="500">crossing-over, durante la meiosis</text><rect x="60.0" y="654.0" width="880.0" height="118.0" rx="20" fill="#0d1734" stroke="#ffd84d" stroke-width="3" filter="url(#g3)"/><text x="94.0" y="725.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="34" fill="#ffd84d" text-anchor="start" font-weight="700">02</text><text x="168.0" y="702.7" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="29" fill="#ffd84d" text-anchor="start" font-weight="700">Segregación independiente</text><text x="168.0" y="736.8" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="start" font-weight="500">cada par se reparte al azar en los gametos</text><rect x="60.0" y="788.0" width="880.0" height="118.0" rx="20" fill="#0d1734" stroke="#66ffa6" stroke-width="3" filter="url(#g2)"/><text x="94.0" y="859.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="34" fill="#66ffa6" text-anchor="start" font-weight="700">03</text><text x="168.0" y="836.7" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="29" fill="#66ffa6" text-anchor="start" font-weight="700">Fecundación al azar</text><text x="168.0" y="870.8" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="start" font-weight="500">cualquier óvulo con cualquier espermatozoide</text></svg>