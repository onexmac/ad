<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1450" width="1000" height="1450"><title>Los argumentos de Rusia y de Ucrania sobre la invasión de 2022</title><defs><filter id="g0" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#35e6ff" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g1" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff53c8" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g2" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#66ffa6" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g3" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ffd84d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g4" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff8a3d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="1450" fill="#070d24"/><text x="500.0" y="92.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="46" fill="#e8f0ff" text-anchor="middle" font-weight="600">Rusia vs. Ucrania</text><text x="500.0" y="140.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#8fa3cc" text-anchor="middle" font-weight="500">dos argumentos sobre la invasión de 2022</text><rect x="60.0" y="175.0" width="880.0" height="135.0" rx="20" fill="#0d1734" stroke="#ff53c8" stroke-width="3" filter="url(#g1)"/><text x="95.0" y="225.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#ff53c8" text-anchor="start" font-weight="700">Rusia</text><text x="95.0" y="272.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#e8f0ff" text-anchor="start" font-weight="500">La ampliación de la OTAN amenaza su seguridad.</text><rect x="60.0" y="330.0" width="880.0" height="170.0" rx="20" fill="#0d1734" stroke="#35e6ff" stroke-width="3" filter="url(#g0)"/><text x="95.0" y="380.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#35e6ff" text-anchor="start" font-weight="700">Ucrania y sus aliados</text><text x="95.0" y="427.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#e8f0ff" text-anchor="start" font-weight="500">Cada Estado elige sus alianzas sin coerción,</text><text x="95.0" y="461.3" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#e8f0ff" text-anchor="start" font-weight="500">y las fronteras no se cambian por la fuerza.</text><rect x="60.0" y="520.0" width="880.0" height="110.0" rx="20" fill="#0d1734" stroke="#ffd84d" stroke-width="3" filter="url(#g3)"/><text x="500.0" y="562.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="middle" font-weight="500">El principio que invoca Ucrania</text><text x="500.0" y="604.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#ffd84d" text-anchor="middle" font-weight="700">soberanía e integridad territorial</text></svg>