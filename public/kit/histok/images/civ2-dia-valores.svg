<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1450" width="1000" height="1450"><title>Los valores democráticos del temario</title><defs><filter id="g0" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#35e6ff" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g1" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff53c8" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g2" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#66ffa6" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g3" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ffd84d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g4" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff8a3d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="1450" fill="#070d24"/><text x="500.0" y="92.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="46" fill="#e8f0ff" text-anchor="middle" font-weight="600">Valores democráticos</text><text x="500.0" y="140.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#8fa3cc" text-anchor="middle" font-weight="500">los seis del temario</text><rect x="60.0" y="175.0" width="432.0" height="120.0" rx="20" fill="#0d1734" stroke="#35e6ff" stroke-width="3" filter="url(#g0)"/><text x="86.0" y="217.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#35e6ff" text-anchor="start" font-weight="700">Libertad</text><text x="86.0" y="253.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#e8f0ff" text-anchor="start" font-weight="500">pensar, decir y elegir</text><text x="86.0" y="283.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#e8f0ff" text-anchor="start" font-weight="500">sin coacción</text><rect x="508.0" y="175.0" width="432.0" height="120.0" rx="20" fill="#0d1734" stroke="#ffd84d" stroke-width="3" filter="url(#g3)"/><text x="534.0" y="217.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#ffd84d" text-anchor="start" font-weight="700">Igualdad política</text><text x="534.0" y="253.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#e8f0ff" text-anchor="start" font-weight="500">un voto vale lo mismo</text><text x="534.0" y="283.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#e8f0ff" text-anchor="start" font-weight="500">que cualquier otro</text><rect x="60.0" y="311.0" width="432.0" height="120.0" rx="20" fill="#0d1734" stroke="#66ffa6" stroke-width="3" filter="url(#g2)"/><text x="86.0" y="353.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#66ffa6" text-anchor="start" font-weight="700">Solidaridad y equidad</text><text x="86.0" y="389.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#e8f0ff" text-anchor="start" font-weight="500">apoyar a quien está</text><text x="86.0" y="419.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#e8f0ff" text-anchor="start" font-weight="500">en desventaja</text><rect x="508.0" y="311.0" width="432.0" height="120.0" rx="20" fill="#0d1734" stroke="#ff53c8" stroke-width="3" filter="url(#g1)"/><text x="534.0" y="353.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#ff53c8" text-anchor="start" font-weight="700">Tolerancia y respeto</text><text x="534.0" y="389.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#e8f0ff" text-anchor="start" font-weight="500">convivir con quien</text><text x="534.0" y="419.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#e8f0ff" text-anchor="start" font-weight="500">piensa distinto</text><rect x="60.0" y="447.0" width="432.0" height="120.0" rx="20" fill="#0d1734" stroke="#ff8a3d" stroke-width="3" filter="url(#g4)"/><text x="86.0" y="489.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#ff8a3d" text-anchor="start" font-weight="700">Paz</text><text x="86.0" y="525.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#e8f0ff" text-anchor="start" font-weight="500">resolver conflictos</text><text x="86.0" y="555.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#e8f0ff" text-anchor="start" font-weight="500">sin violencia</text><rect x="508.0" y="447.0" width="432.0" height="120.0" rx="20" fill="#0d1734" stroke="#35e6ff" stroke-width="3" filter="url(#g0)"/><text x="534.0" y="489.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#35e6ff" text-anchor="start" font-weight="700">Honestidad</text><text x="534.0" y="525.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#e8f0ff" text-anchor="start" font-weight="500">actuar con la verdad,</text><text x="534.0" y="555.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#e8f0ff" text-anchor="start" font-weight="500">también en lo público</text></svg>