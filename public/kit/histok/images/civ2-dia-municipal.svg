ont-weight="500">los regidores:</text><text x="86.0" y="427.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#e8f0ff" text-anchor="start" font-weight="500">deliberan y deciden</text><rect x="508.0" y="319.0" width="432.0" height="128.0" rx="20" fill="#0d1734" stroke="#ff53c8" stroke-width="3" filter="url(#g1)"/><text x="534.0" y="361.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#ff53c8" text-anchor="start" font-weight="700">Elecciones propias</text><text x="534.0" y="397.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#e8f0ff" text-anchor="start" font-weight="500">cada 4 años, a mitad</text><text x="534.0" y="427.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#e8f0ff" text-anchor="start" font-weight="500">del periodo nacional</text><rect x="60.0" y="463.0" width="432.0" height="128.0" rx="20" fill="#0d1734" stroke="#ff8a3d" stroke-width="3" filter="url(#g4)"/><text x="86.0" y="505.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#ff8a3d" text-anchor="start" font-weight="700">Servicios</text><text x="86.0" y="541.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#e8f0ff" text-anchor="start" font-weight="500">basura, calles, parques,</text><text x="86.0" y="571.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#e8f0ff" text-anchor="start" font-weight="500">permisos y patentes</text><rect x="508.0" y="463.0" width="432.0" height="128.0" rx="20" fill="#0d1734" stroke="#35e6ff" stroke-width="3" filter="url(#g0)"/><text x="534.0" y="505.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#35e6ff" text-anchor="start" font-weight="700">Distritos</t