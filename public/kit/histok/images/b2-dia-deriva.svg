-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="start" font-weight="600">gen. 4</text><circle cx="230.0" cy="680.0" r="17.0" fill="#35e6ff"/><circle cx="282.0" cy="680.0" r="17.0" fill="#35e6ff"/><circle cx="334.0" cy="680.0" r="17.0" fill="#35e6ff"/><circle cx="386.0" cy="680.0" r="17.0" fill="#35e6ff"/><circle cx="438.0" cy="680.0" r="17.0" fill="#35e6ff"/><circle cx="490.0" cy="680.0" r="17.0" fill="#35e6ff"/><circle cx="542.0" cy="680.0" r="17.0" fill="#35e6ff"/><circle cx="594.0" cy="680.0" r="17.0" fill="#35e6ff"/><circle cx="646.0" cy="680.0" r="17.0" fill="#35e6ff"/><circle cx="698.0" cy="680.0" r="17.0" fill="#35e6ff"/><text x="930.0" y="689.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#35e6ff" text-anchor="end" font-weight="700">100 %</text><text x="500.0" y="790.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#ffd84d" text-anchor="middle" font-weight="600">el alelo amarillo se perdió: nadie lo eligió</text><rect x="60.0" y="840.0" width="880.0" height="110.0" rx="20" fill="#0d1734" stroke="#ff53c8" stroke-width="3" filter="url(#g1)"/><text x="90.0" y="886.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25" fill="#e8f0ff" text-anchor="start" font-weight="600">Pesa más en poblaciones pequeñas,</text><text x="90.0" y="920.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="25" fill="#e8f0ff" text-anchor="start" font-weight="600">y no tiene que ver con adaptarse.</text></svg>