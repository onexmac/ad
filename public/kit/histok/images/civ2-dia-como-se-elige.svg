<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1450" width="1000" height="1450"><title>Cómo se elige en Costa Rica</title><defs><filter id="g0" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#35e6ff" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g1" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff53c8" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g2" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#66ffa6" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g3" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ffd84d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g4" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff8a3d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="1450" fill="#070d24"/><text x="500.0" y="92.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="46" fill="#e8f0ff" text-anchor="middle" font-weight="600">Cómo se elige</text><text x="500.0" y="140.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#8fa3cc" text-anchor="middle" font-weight="500">elecciones nacionales</text><rect x="60.0" y="168.0" width="880.0" height="81.0" rx="20" fill="#0d1734" stroke="#35e6ff" stroke-width="3" filter="url(#g0)"/><text x="90.0" y="208.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#35e6ff" text-anchor="start" font-weight="700">Cada 4 años, primer domingo de febrero</text><text x="90.0" y="242.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#e8f0ff" text-anchor="start" font-weight="500">Presidencia, vicepresidencias y 57 diputados</text><rect x="60.0" y="261.0" width="880.0" height="110.0" rx="20" fill="#0d1734" stroke="#ffd84d" stroke-width="3" filter="url(#g3)"/><text x="90.0" y="301.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#ffd84d" text-anchor="start" font-weight="700">Para ganar la presidencia</text><text x="90.0" y="335.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#e8f0ff" text-anchor="start" font-weight="500">Más del 40 % de los votos válidos; si nadie</text><text x="90.0" y="364.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#e8f0ff" text-anchor="start" font-weight="500">llega, segunda ronda el primer domingo de abril</text><rect x="60.0" y="383.0" width="880.0" height="81.0" rx="20" fill="#0d1734" stroke="#66ffa6" stroke-width="3" filter="url(#g2)"/><text x="90.0" y="423.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#66ffa6" text-anchor="start" font-weight="700">Diputados</text><text x="90.0" y="457.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#e8f0ff" text-anchor="start" font-weight="500">Por provincia, según los votos de cada partido</text><rect x="60.0" y="476.0" width="880.0" height="81.0" rx="20" fill="#0d1734" stroke="#ff53c8" stroke-width="3" filter="url(#g1)"/><text x="90.0" y="516.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#ff53c8" text-anchor="start" font-weight="700">Municipales</text><text x="90.0" y="550.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#e8f0ff" text-anchor="start" font-weight="500">En su propia elección, dos años después</text></svg>