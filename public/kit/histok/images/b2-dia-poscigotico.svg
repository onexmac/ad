<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1450" width="1000" height="1450"><title>Los tres tipos de aislamiento reproductivo poscigótico</title><defs><filter id="g0" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#35e6ff" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g1" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff53c8" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g2" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#66ffa6" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g3" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ffd84d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g4" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff8a3d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="1450" fill="#070d24"/><text x="500.0" y="92.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="46" fill="#e8f0ff" text-anchor="middle" font-weight="600">Aislamiento poscigótico</text><text x="500.0" y="140.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#8fa3cc" text-anchor="middle" font-weight="500">hay híbrido… pero falla</text><circle cx="250.0" cy="250.0" r="40.0" fill="none" stroke="#35e6ff" stroke-width="4"/><text x="250.0" y="260.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#35e6ff" text-anchor="middle" font-weight="700">A</text><text x="345.0" y="262.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="40" fill="#e8f0ff" text-anchor="middle" font-weight="700">+</text><circle cx="440.0" cy="250.0" r="40.0" fill="none" stroke="#ffd84d" stroke-width="4"/><text x="440.0" y="260.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="30" fill="#ffd84d" text-anchor="middle" font-weight="700">B</text><line x1="510.0" y1="250.0" x2="584.0" y2="250.0" stroke="#e8f0ff" stroke-width="4" stroke-linecap="round"/><polygon points="600.0,250.0 584.0,242.0 584.0,258.0" fill="#e8f0ff"/><circle cx="680.0" cy="250.0" r="46.0" fill="none" stroke="#66ffa6" stroke-width="4" filter="url(#g2)"/><text x="680.0" y="260.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="28" fill="#66ffa6" text-anchor="middle" font-weight="700">AB</text><text x="680.0" y="330.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="middle" font-weight="500">híbrido</text><rect x="60.0" y="380.0" width="880.0" height="140.0" rx="20" fill="#0d1734" stroke="#ff53c8" stroke-width="3" filter="url(#g1)"/><text x="94.0" y="462.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="34" fill="#ff53c8" text-anchor="start" font-weight="700">01</text><text x="168.0" y="439.7" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="29" fill="#ff53c8" text-anchor="start" font-weight="700">Inviabilidad del híbrido</text><text x="168.0" y="473.8" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="start" font-weight="500">muere antes de llegar a adulto</text><rect x="60.0" y="540.0" width="880.0" height="140.0" rx="20" fill="#0d1734" stroke="#ff8a3d" stroke-width="3" filter="url(#g4)"/><text x="94.0" y="622.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="34" fill="#ff8a3d" text-anchor="start" font-weight="700">02</text><text x="168.0" y="599.7" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="29" fill="#ff8a3d" text-anchor="start" font-weight="700">Esterilidad del híbrido</text><text x="168.0" y="633.8" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="start" font-weight="500">vive, pero no puede tener crías</text><rect x="60.0" y="700.0" width="880.0" height="140.0" rx="20" fill="#0d1734" stroke="#ffd84d" stroke-width="3" filter="url(#g3)"/><text x="94.0" y="782.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="34" fill="#ffd84d" text-anchor="start" font-weight="700">03</text><text x="168.0" y="759.7" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="29" fill="#ffd84d" text-anchor="start" font-weight="700">Degradación del híbrido</text><text x="168.0" y="793.8" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="start" font-weight="500">la 1.ª generación es fértil; la siguiente ya no</text></svg>