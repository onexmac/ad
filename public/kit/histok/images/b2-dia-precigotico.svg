<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1450" width="1000" height="1450"><title>Los cinco tipos de aislamiento reproductivo precigótico</title><defs><filter id="g0" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#35e6ff" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g1" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff53c8" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g2" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#66ffa6" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g3" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ffd84d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g4" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff8a3d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="1450" fill="#070d24"/><text x="500.0" y="92.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="46" fill="#e8f0ff" text-anchor="middle" font-weight="600">Aislamiento precigótico</text><text x="500.0" y="140.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#8fa3cc" text-anchor="middle" font-weight="500">impide que se forme el cigoto</text><rect x="60.0" y="186.0" width="880.0" height="128.0" rx="20" fill="#0d1734" stroke="#35e6ff" stroke-width="3" filter="url(#g0)"/><text x="94.0" y="262.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="34" fill="#35e6ff" text-anchor="start" font-weight="700">01</text><text x="168.0" y="239.7" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="29" fill="#35e6ff" text-anchor="start" font-weight="700">Ecológico o de hábitat</text><text x="168.0" y="273.8" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="start" font-weight="500">viven en lugares distintos y no se encuentran</text><rect x="60.0" y="332.0" width="880.0" height="128.0" rx="20" fill="#0d1734" stroke="#66ffa6" stroke-width="3" filter="url(#g2)"/><text x="94.0" y="408.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="34" fill="#66ffa6" text-anchor="start" font-weight="700">02</text><text x="168.0" y="385.7" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="29" fill="#66ffa6" text-anchor="start" font-weight="700">Temporal</text><text x="168.0" y="419.8" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="start" font-weight="500">se reproducen en épocas u horas distintas</text><rect x="60.0" y="478.0" width="880.0" height="128.0" rx="20" fill="#0d1734" stroke="#ffd84d" stroke-width="3" filter="url(#g3)"/><text x="94.0" y="554.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="34" fill="#ffd84d" text-anchor="start" font-weight="700">03</text><text x="168.0" y="531.7" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="29" fill="#ffd84d" text-anchor="start" font-weight="700">Etológico o conductual</text><text x="168.0" y="565.8" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="start" font-weight="500">no reconocen el cortejo de la otra especie</text><rect x="60.0" y="624.0" width="880.0" height="128.0" rx="20" fill="#0d1734" stroke="#ff8a3d" stroke-width="3" filter="url(#g4)"/><text x="94.0" y="700.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="34" fill="#ff8a3d" text-anchor="start" font-weight="700">04</text><text x="168.0" y="677.7" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="29" fill="#ff8a3d" text-anchor="start" font-weight="700">Mecánico</text><text x="168.0" y="711.8" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="start" font-weight="500">los órganos reproductores no encajan</text><rect x="60.0" y="770.0" width="880.0" height="128.0" rx="20" fill="#0d1734" stroke="#ff53c8" stroke-width="3" filter="url(#g1)"/><text x="94.0" y="846.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="34" fill="#ff53c8" text-anchor="start" font-weight="700">05</text><text x="168.0" y="823.7" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="29" fill="#ff53c8" text-anchor="start" font-weight="700">Gamético</text><text x="168.0" y="857.8" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="start" font-weight="500">el espermatozoide no reconoce al óvulo</text></svg>