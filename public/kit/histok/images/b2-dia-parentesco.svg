,Arial,sans-serif" font-size="27" fill="#8fa3cc" text-anchor="middle" font-weight="500">más rasgos en común = pariente más cercano</text><line x1="130.0" y1="840.0" x2="830.0" y2="270.0" stroke="#e8f0ff" stroke-width="6" stroke-linecap="round"/><text x="170.0" y="248.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#35e6ff" text-anchor="middle" font-weight="700">pez</text><line x1="200.0" y1="783.0" x2="170.0" y2="270.0" stroke="#e8f0ff" stroke-width="5" stroke-linecap="round"/><text x="335.0" y="248.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#66ffa6" text-anchor="middle" font-weight="700">rana</text><line x1="354.0" y1="657.6" x2="335.0" y2="270.0" stroke="#e8f0ff" stroke-width="5" stroke-linecap="round"/><text x="500.0" y="248.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#ff53c8" text-anchor="middle" font-weight="700">humano</text><line x1="508.0" y1="532.2" x2="500.0" y2="270.0" stroke="#e8f0ff" stroke-width="5" stroke-linecap="round"/><text x="665.0" y="248.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#ffd84d" text-anchor="middle" font-weight="700">lagarto</text><line x1="676.0" y1="395.4" x2="665.0" y2="270.0" stroke="#e8f0ff" stroke-width="5" stroke-linecap="round"/><text x="830.0" y="248.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#ff8a3d" text-anchor="middle" font-weight="700">ave</text><circle cx="277.0" cy="720.3" r="10.0" fill="#ffd84d"/><text x="299.0" y="728.3" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#ffd84d" text-anchor="start" font-weight="700">cuatro patas</text><circle cx="431.0" cy="594.9" r="10.0" fill="#ffd84d"/><text x="453.0" y="602.9" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#ffd84d" text-anchor="start" font-weight="700">huevo con cáscara</text><text x="500.0" y="905.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="middle" font-weight="500">El ave y el lagarto comparten más rasgos entre sí</text><text x="500.0" y="935.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#8fa3cc" text-anchor="middle" font-weight="500">que con el humano: su antepasado común es más reciente.</text></svg>