<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1450" width="1000" height="1450"><title>Los cinco pasos de la selección natural según Darwin</title><defs><filter id="g0" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#35e6ff" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g1" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff53c8" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g2" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#66ffa6" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g3" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ffd84d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="g4" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1600" height="2000"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#ff8a3d" flood-opacity="0.55"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="1450" fill="#070d24"/><text x="500.0" y="92.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="46" fill="#e8f0ff" text-anchor="middle" font-weight="600">Selección natural</text><text x="500.0" y="140.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" fill="#8fa3cc" text-anchor="middle" font-weight="500">cinco pasos</text><rect x="60.0" y="186.0" width="880.0" height="124.0" rx="20" fill="#0d1734" stroke="#35e6ff" stroke-width="3" filter="url(#g0)"/><text x="94.0" y="260.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="34" fill="#35e6ff" text-anchor="start" font-weight="700">01</text><text x="168.0" y="237.7" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="29" fill="#35e6ff" text-anchor="start" font-weight="700">Variación</text><text x="168.0" y="271.8" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="start" font-weight="500">los individuos de una especie no son iguales</text><line x1="500.0" y1="312.0" x2="500.0" y2="320.0" stroke="#e8f0ff" stroke-width="4" stroke-linecap="round"/><polygon points="500.0,336.0 508.0,320.0 492.0,320.0" fill="#e8f0ff"/><rect x="60.0" y="340.0" width="880.0" height="124.0" rx="20" fill="#0d1734" stroke="#ffd84d" stroke-width="3" filter="url(#g3)"/><text x="94.0" y="414.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="34" fill="#ffd84d" text-anchor="start" font-weight="700">02</text><text x="168.0" y="391.7" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="29" fill="#ffd84d" text-anchor="start" font-weight="700">Sobreproducción</text><text x="168.0" y="425.8" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="start" font-weight="500">nacen más de los que pueden sobrevivir</text><line x1="500.0" y1="466.0" x2="500.0" y2="474.0" stroke="#e8f0ff" stroke-width="4" stroke-linecap="round"/><polygon points="500.0,490.0 508.0,474.0 492.0,474.0" fill="#e8f0ff"/><rect x="60.0" y="494.0" width="880.0" height="124.0" rx="20" fill="#0d1734" stroke="#ff8a3d" stroke-width="3" filter="url(#g4)"/><text x="94.0" y="568.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="34" fill="#ff8a3d" text-anchor="start" font-weight="700">03</text><text x="168.0" y="545.7" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="29" fill="#ff8a3d" text-anchor="start" font-weight="700">Lucha por la existencia</text><text x="168.0" y="579.8" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="start" font-weight="500">compiten por comida, pareja y espacio</text><line x1="500.0" y1="620.0" x2="500.0" y2="628.0" stroke="#e8f0ff" stroke-width="4" stroke-linecap="round"/><polygon points="500.0,644.0 508.0,628.0 492.0,628.0" fill="#e8f0ff"/><rect x="60.0" y="648.0" width="880.0" height="124.0" rx="20" fill="#0d1734" stroke="#66ffa6" stroke-width="3" filter="url(#g2)"/><text x="94.0" y="722.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="34" fill="#66ffa6" text-anchor="start" font-weight="700">04</text><text x="168.0" y="699.7" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="29" fill="#66ffa6" text-anchor="start" font-weight="700">Sobreviven los más aptos</text><text x="168.0" y="733.8" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="start" font-weight="500">los mejor adaptados se reproducen más</text><line x1="500.0" y1="774.0" x2="500.0" y2="782.0" stroke="#e8f0ff" stroke-width="4" stroke-linecap="round"/><polygon points="500.0,798.0 508.0,782.0 492.0,782.0" fill="#e8f0ff"/><rect x="60.0" y="802.0" width="880.0" height="124.0" rx="20" fill="#0d1734" stroke="#ff53c8" stroke-width="3" filter="url(#g1)"/><text x="94.0" y="876.0" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="34" fill="#ff53c8" text-anchor="start" font-weight="700">05</text><text x="168.0" y="853.7" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="29" fill="#ff53c8" text-anchor="start" font-weight="700">Herencia</text><text x="168.0" y="887.8" font-family="ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8fa3cc" text-anchor="start" font-weight="500">pasan sus rasgos: la población cambia</text></svg>